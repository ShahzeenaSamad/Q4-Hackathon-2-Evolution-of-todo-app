{{/*
Secret for backend sensitive data
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-chatbot.fullname" . }}-backend-secrets
  labels:
    {{- include "todo-chatbot.backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  COHERE_API_KEY: {{ .Values.backend.secrets.COHERE_API_KEY | quote }}
